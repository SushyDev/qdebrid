version: '3.8'

services:
  qdebrid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qdebrid
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Config file (required)
      - ./config.yml:/config/config.yml:ro
      # Media directory (optional, for path validation)
      - ${MEDIA_PATH:-/mnt/media}:/media
    environment:
      # Override config with environment variables if needed
      - TZ=${TZ:-UTC}
      - QDEBRID_SERVER_HOST=${QDEBRID_SERVER_HOST:-0.0.0.0}
      - QDEBRID_SERVER_PORT=${QDEBRID_SERVER_PORT:-8080}
      - QDEBRID_REAL_DEBRID_TOKEN=${QDEBRID_REAL_DEBRID_TOKEN}
      - QDEBRID_LOGGING_LEVEL=${QDEBRID_LOGGING_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - qdebrid

networks:
  qdebrid:
    name: qdebrid
    driver: bridge
